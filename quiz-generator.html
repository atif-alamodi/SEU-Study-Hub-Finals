<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد الاختبارات · SEU Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563eb;
  --primary-light: #dbeafe;
  --accent: #d97706;
  --success: #16a34a;
  --success-light: #dcfce7;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --bg: #f8fafc;
  --bg-soft: #f1f5f9;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.05);
  --easy: #16a34a;
  --medium: #d97706;
  --hard: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans Arabic', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  padding: 20px 16px 60px;
  min-height: 100vh;
}
.container { max-width: 760px; margin: 0 auto; }

.header {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: white;
  padding: 28px 24px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 22px;
  box-shadow: 0 8px 24px rgba(239, 68, 68, 0.25);
}
.header h1 { font-size: 1.6rem; margin-bottom: 8px; font-weight: 800; }
.header p { opacity: 0.95; font-size: 0.95rem; }

.subject-picker {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.subject-picker .label {
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
  font-size: 0.95rem;
}
.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.subject-btn {
  padding: 16px 10px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: white;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}
.subject-btn .ico { font-size: 1.5rem; }
.subject-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.subject-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
}
.subject-btn.active .code { color: rgba(255,255,255,0.85); }
.subject-btn .code { font-size: 0.7rem; opacity: 0.7; font-family: 'JetBrains Mono'; }

.actions {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}
.btn-primary, .btn-secondary {
  flex: 1;
  padding: 14px 18px;
  border-radius: 12px;
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), #1e40af);
  color: white;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary {
  background: white;
  color: var(--text);
  border: 2px solid var(--border);
}
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

.empty-state {
  background: white;
  padding: 40px 24px;
  border-radius: 16px;
  text-align: center;
  box-shadow: var(--shadow);
}
.empty-state .ico { font-size: 3rem; margin-bottom: 12px; }
.empty-state h2 { font-size: 1.15rem; margin-bottom: 6px; }
.empty-state p { color: var(--text-muted); font-size: 0.9rem; }

.progress-bar {
  background: white;
  padding: 14px 18px;
  border-radius: 12px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  font-size: 0.9rem;
  font-weight: 600;
}
.progress-bar .answered { color: var(--success); }
.progress-bar .score { color: var(--primary); font-family: 'JetBrains Mono'; font-size: 1rem; }

.quiz-q {
  background: white;
  padding: 18px 20px;
  border-radius: 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  border-right: 4px solid var(--primary);
  transition: border-color 0.3s;
}
.quiz-q.difficulty-easy { border-right-color: var(--easy); }
.quiz-q.difficulty-medium { border-right-color: var(--medium); }
.quiz-q.difficulty-hard { border-right-color: var(--hard); }

.q-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 0.78rem;
  color: var(--text-muted);
}
.q-num { font-weight: 700; color: var(--primary); font-family: 'JetBrains Mono'; }
.q-difficulty {
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.72rem;
}
.q-difficulty.easy { background: var(--success-light); color: var(--success); }
.q-difficulty.medium { background: #fef3c7; color: var(--medium); }
.q-difficulty.hard { background: var(--danger-light); color: var(--danger); }

.q-text {
  font-weight: 600;
  margin-bottom: 14px;
  line-height: 1.8;
  font-size: 0.95rem;
}
.q-text code {
  background: var(--bg-soft);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88em;
  direction: ltr;
  display: inline-block;
}

.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg);
  border: 2px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.18s;
  text-align: right;
  font-family: inherit;
  font-size: 0.9rem;
  width: 100%;
  line-height: 1.6;
}
.quiz-option:hover:not(:disabled) {
  border-color: var(--primary);
  background: var(--primary-light);
}
.quiz-option:disabled { cursor: default; }
.quiz-option .letter {
  width: 26px;
  height: 26px;
  background: white;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.78rem;
  font-family: 'JetBrains Mono';
  flex-shrink: 0;
  color: var(--text-muted);
}
.quiz-option .opt-text { flex: 1; padding-top: 2px; }
.quiz-option.correct {
  background: var(--success-light);
  border-color: var(--success);
  color: #14532d;
}
.quiz-option.correct .letter { background: var(--success); color: white; }
.quiz-option.wrong {
  background: var(--danger-light);
  border-color: var(--danger);
  color: #7f1d1d;
}
.quiz-option.wrong .letter { background: var(--danger); color: white; }

.quiz-explain {
  font-size: 0.85rem;
  color: var(--text);
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--bg-soft);
  border-radius: 8px;
  line-height: 1.8;
  display: none;
  border-right: 3px solid var(--primary);
}
.quiz-q.answered .quiz-explain { display: block; }
.quiz-explain strong { color: var(--primary); }

.final-result {
  background: white;
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  margin-top: 20px;
  box-shadow: var(--shadow);
  border: 2px solid var(--success);
}
.final-result.warn { border-color: var(--accent); }
.final-result.danger { border-color: var(--danger); }
.final-result .big-score {
  font-size: 2.4rem;
  font-weight: 800;
  color: var(--success);
  margin-bottom: 4px;
  font-family: 'JetBrains Mono';
}
.final-result.warn .big-score { color: var(--accent); }
.final-result.danger .big-score { color: var(--danger); }
.final-result .label { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 14px; }
.final-result .feedback { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }

@media (max-width: 480px) {
  body { padding: 14px 10px 50px; }
  .header { padding: 22px 18px; }
  .header h1 { font-size: 1.35rem; }
  .subject-grid { gap: 8px; }
  .subject-btn { padding: 12px 6px; font-size: 0.78rem; }
  .quiz-q { padding: 14px 16px; }
  .q-text { font-size: 0.9rem; }
  .quiz-option { padding: 10px 12px; font-size: 0.85rem; }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🎯 مولد الاختبارات</h1>
    <p>10 أسئلة عشوائية من المنهج · صعوبات متنوعة</p>
  </div>

  <div class="subject-picker">
    <div class="label">📚 اختر المادة</div>
    <div class="subject-grid">
      <button class="subject-btn active" data-subject="osc" onclick="pickSubject('osc')">
        <span class="ico">💻</span>
        <span>نظم التشغيل</span>
        <span class="code">OSC</span>
      </button>
      <button class="subject-btn" data-subject="stats" onclick="pickSubject('stats')">
        <span class="ico">📊</span>
        <span>الإحصاء</span>
        <span class="code">STA104</span>
      </button>
      <button class="subject-btn" data-subject="python" onclick="pickSubject('python')">
        <span class="ico">🐍</span>
        <span>البايثون</span>
        <span class="code">PYT103</span>
      </button>
    </div>
    <div id="capacity-line" style="margin-top:14px;padding:10px 14px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-radius:10px;font-size:0.82rem;color:#065f46;text-align:center;font-weight:600;">
      <span id="capacity-text">جاري الحساب...</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="generateQuiz()">
      <span>🎲</span><span>توليد اختبار جديد</span>
    </button>
    <button class="btn-secondary" id="clearBtn" onclick="clearQuiz()" style="display:none;">
      <span>🗑️</span><span>مسح</span>
    </button>
  </div>

  <div id="progress" style="display:none;"></div>
  <div id="quiz-area">
    <div class="empty-state">
      <div class="ico">📝</div>
      <h2>جاهز لتولّد اختبارك الأول؟</h2>
      <p>اختر المادة من الأعلى ثم اضغط "توليد اختبار جديد" لاختبار من 10 أسئلة عشوائية.</p>
    </div>
  </div>
  <div id="result-area"></div>

</div>

<script>
// ===========================================================
// بنوك الأسئلة (مستقاة من منهج المنصة المتفق عليه)
// ===========================================================
const QUESTION_BANKS = {
  // ============ نظم التشغيل ============
  osc: [
    // ---- سهل ----
    { d: 'easy', q: 'ما هو نظام التشغيل؟', opts: [
      'برنامج تطبيقي للمستخدم النهائي مثل Word',
      'برنامج يعمل كوسيط بين المستخدم وعتاد الحاسوب ويدير الموارد',
      'نوع من أنواع العتاد الموجود في الحاسوب',
      'لغة برمجة لكتابة التطبيقات'
    ], a: 1, e: 'نظام التشغيل (OS) هو برنامج يعمل كوسيط بين المستخدم والعتاد، ويدير المعالج والذاكرة والملفات والأجهزة.' },

    { d: 'easy', q: 'أي مما يلي ليس من حالات العملية (Process States)؟', opts: [
      'New', 'Ready', 'Compiling', 'Waiting'
    ], a: 2, e: 'حالات العملية هي: New, Ready, Running, Waiting, Terminated. أما Compiling فهي مرحلة قبل التنفيذ وليست حالة عملية.' },

    { d: 'easy', q: 'ما الذي يحفظ معلومات العملية مثل الحالة والسجلات والذاكرة؟', opts: [
      'جدول الصفحات (Page Table)', 'كتلة التحكم بالعملية (PCB) (Process Control Block)', 'ذاكرة الترجمة المؤقتة (TLB)', 'File Allocation Table'
    ], a: 1, e: 'كتلة التحكم بالعملية (PCB) هو هيكل بيانات يحفظ كل معلومات العملية ليتمكن النظام من إدارتها واستئناف تنفيذها.' },

    { d: 'easy', q: 'في خوارزمية الأول يخدم أولاً (FCFS) للجدولة، أي عملية تنفّذ أولاً؟', opts: [
      'الأقصر مدةً', 'الأعلى أولوية', 'التي وصلت أولاً إلى طابور الجاهزية', 'الأحدث وصولاً'
    ], a: 2, e: 'الأول يخدم أولاً (FCFS) = First Come First Served، وتنفّذ العمليات بترتيب وصولها إلى طابور الجاهزية.' },

    { d: 'easy', q: 'ما الفرق الأساسي بين العملية (Process) والخيط (Thread)؟', opts: [
      'لا يوجد فرق، كلاهما نفس الشيء',
      'الخيط أثقل من العملية',
      'الخيوط داخل العملية تشترك في الذاكرة، بينما العمليات لها ذاكرات منفصلة',
      'العمليات لا يمكن أن تحتوي على خيوط'
    ], a: 2, e: 'الخيوط (Threads) هي وحدات تنفيذ خفيفة داخل عملية واحدة وتشترك في نفس مساحة الذاكرة، بينما كل عملية لها مساحة ذاكرة مستقلة.' },

    { d: 'easy', q: 'ما هو الـ القفل الثنائي (Mutex)؟', opts: [
      'خوارزمية لجدولة المعالج',
      'قفل ثنائي يسمح بوصول واحد فقط في الوقت نفسه',
      'نوع من أنواع الذاكرة الافتراضية',
      'بروتوكول لإدارة الملفات'
    ], a: 1, e: 'القفل الثنائي (Mutex) (Mutual Exclusion) قفل ثنائي يضمن أن خيطاً واحداً فقط يدخل المنطقة الحرجة في وقت واحد.' },

    { d: 'easy', q: 'ما الذي يقلل متوسط زمن الانتظار نظرياً أكثر من الخوارزميات الأخرى؟', opts: [
      'الأول يخدم أولاً (FCFS)', 'الأقصر أولاً (SJF) (Shortest Job First)', 'الجولات الدورية (Round Robin)', 'Priority Scheduling'
    ], a: 1, e: 'الأقصر أولاً (SJF) تقلل متوسط زمن الانتظار نظرياً لأنها تختار الأقصر أولاً، لكنها قد تسبب تجويعاً للعمليات الطويلة.' },

    { d: 'easy', q: 'ما اسم المنطقة من الكود التي تحتاج وصولاً حصرياً للموارد المشتركة؟', opts: [
      'المنطقة الحرجة (Critical Section)', 'Race Section', 'Atomic Block', 'Locked Region'
    ], a: 0, e: 'المنطقة الحرجة (Critical Section) هي منطقة الكود التي تصل لمورد مشترك، وتحتاج آلية مزامنة لمنع حالة التسابق (Race Condition).' },

    { d: 'easy', q: 'في إدارة الذاكرة بطريقة Paging، ما الفرق بين الـ Page والـ Frame؟', opts: [
      'لا فرق، نفس المفهوم',
      'Page منطقي وFrame فيزيائي',
      'Page فيزيائي وFrame منطقي',
      'Page للقراءة وFrame للكتابة'
    ], a: 1, e: 'Page = صفحة منطقية في فضاء العنوان للعملية. Frame = إطار فيزيائي في الذاكرة الرئيسية.' },

    { d: 'easy', q: 'ما هو الـ خطأ الصفحة (Page Fault)؟', opts: [
      'خطأ في كتابة الكود',
      'خطأ يحدث عندما تكون الصفحة المطلوبة غير موجودة في الذاكرة الرئيسية',
      'تلف في القرص الصلب',
      'انقطاع في الكهرباء'
    ], a: 1, e: 'خطأ الصفحة (Page Fault) يحدث عند محاولة الوصول لصفحة غير موجودة في الذاكرة الفعلية، فيُحضرها النظام من القرص.' },

    // ---- متوسط ----
    { d: 'medium', q: 'في خوارزمية الجولات الدورية (Round Robin)، ماذا يحدث عند انتهاء الشريحة الزمنية (Time Quantum) لعملية لم تنتهِ بعد؟', opts: [
      'تُنهى العملية فوراً',
      'تنتقل إلى نهاية طابور الجاهزية',
      'تنتقل إلى حالة Waiting',
      'تنتقل إلى بداية طابور الجاهزية'
    ], a: 1, e: 'في RR إذا انتهت الشريحة الزمنية ولم تنتهِ العملية، تُنقل إلى نهاية طابور الجاهزية لإعطاء الفرصة لباقي العمليات.' },

    { d: 'medium', q: 'ما الشروط الأربعة الضرورية لحدوث التوقف التام (Deadlock)؟', opts: [
      'الإقصاء المتبادل (Mutual exclusion), الإمساك والانتظار (Hold and wait), عدم الاستباق (No preemption), الانتظار الدائري (Circular wait)',
      'Race condition, التجويع (Starvation), Priority inversion, التقدّم بالعمر (Aging)',
      'Paging, Segmentation, Swapping, Caching',
      'الأول يخدم أولاً (FCFS), الأقصر أولاً (SJF), RR, Priority'
    ], a: 0, e: 'شروط كوفمان (Coffman) الأربعة لحدوث التوقف التام (Deadlock): الإقصاء المتبادل (Mutual exclusion) (وصول حصري), الإمساك والانتظار (Hold and wait) (إمساك وانتظار), عدم الاستباق (No preemption) (عدم الاستباق), الانتظار الدائري (Circular wait) (انتظار دائري).' },

    { d: 'medium', q: 'ما الفرق بين الـ القفل الثنائي (Mutex) والـ الإشارة (Semaphore)؟', opts: [
      'لا يوجد فرق، نفس الشيء',
      'القفل الثنائي (Mutex) يسمح بوصول واحد، أما الإشارة (Semaphore) فهو عداد يسمح بعدد محدد من الوصول',
      'القفل الثنائي (Mutex) لإدارة الذاكرة، الإشارة (Semaphore) لإدارة الملفات',
      'القفل الثنائي (Mutex) أبطأ من الإشارة (Semaphore) دائماً'
    ], a: 1, e: 'القفل الثنائي (Mutex) قفل ثنائي (مفتوح/مغلق)، بينما الإشارة (Semaphore) عداد يحدد كم خيطاً يستطيع الدخول للمنطقة في وقت واحد.' },

    { d: 'medium', q: 'في خوارزمية LRU لاستبدال الصفحات، أي صفحة تُستبدل عند حدوث خطأ الصفحة (Page Fault)؟', opts: [
      'الأقدم في الذاكرة',
      'الأحدث استخداماً',
      'الأقل استخداماً مؤخراً',
      'الأكثر استخداماً'
    ], a: 2, e: 'LRU = Least Recently Used. تستبدل الصفحة التي لم تُستخدم لأطول فترة مؤخراً، بناءً على افتراض أنها لن تُستخدم قريباً.' },

    { d: 'medium', q: 'ما وظيفة الـ ذاكرة الترجمة المؤقتة (TLB) (Translation Lookaside Buffer)؟', opts: [
      'تخزين الملفات المؤقتة',
      'ذاكرة تخزين مؤقت لتسريع ترجمة العناوين الافتراضية إلى فيزيائية',
      'إدارة طوابير الجدولة',
      'حماية الذاكرة من الفيروسات'
    ], a: 1, e: 'ذاكرة الترجمة المؤقتة (TLB) ذاكرة تخزين مؤقت داخل المعالج تحفظ الترجمات الأخيرة من جدول الصفحات (Page Table) لتسريع الوصول وتجنب البحث في الجدول كل مرة.' },

    { d: 'medium', q: 'ماذا تعني المشكلة الكلاسيكية المنتج-المستهلك (Producer-Consumer)؟', opts: [
      'كيف يبيع المنتجون السلع للمستهلكين',
      'مشكلة مزامنة بين خيوط تنتج بيانات وأخرى تستهلكها عبر مخزن مؤقت محدود',

const RND = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const RNDF = (min, max, decimals = 2) => {
  const v = Math.random() * (max - min) + min;
  return parseFloat(v.toFixed(decimals));
};
const PICK = (arr) => arr[Math.floor(Math.random() * arr.length)];

// خلط الخيارات وتحديد الإجابة الصحيحة بدقة عبر مقارنة النصوص
function buildQ(d, q, correctValue, distractors, explanation, category) {
  const correctStr = String(correctValue);
  const allStrs = [correctStr, ...distractors.map(String)];
  // إزالة التكرار للأمان
  const uniq = [...new Set(allStrs)];
  while (uniq.length < 4) uniq.push(String(RND(1, 1000)));
  const opts = shuffle(uniq.slice(0, 4));
  return {
    d,
    q,
    opts,
    a: opts.indexOf(correctStr),
    e: explanation,
    category: category || 'code', // 'code' أو 'theory'
    _generated: true
  };
}

    () => {
      const burst = Array.from({length: 3}, () => RND(2, 15));

      for (let i = 0; i < burst.length; i++) {
        waitSum += cumul;
        cumul += burst[i];
      }
      const avgWait = waitSum / burst.length;
      const procs = burst.map((b,i) => `P${i+1}=${b}`).join(', ');
      return buildQ(
        'medium',
        `حُسب متوسط زمن الانتظار لجدولة FCFS بالعمليات (${procs}) بترتيب الوصول. ما الناتج؟`,
        avgWait.toFixed(2).replace(/\.00$/,''),
        [(avgWait + 2).toFixed(1), (avgWait/2).toFixed(1), burst[0].toString(), (burst[0]+burst[1]).toString()],
        `P1 ينتظر 0، P2 ينتظر ${burst[0]}، P3 ينتظر ${burst[0]+burst[1]}. المتوسط = (0 + ${burst[0]} + ${burst[0]+burst[1]}) / 3 = ${avgWait}`
      );
    },

    () => {
      const n = PICK([3, 4]);

      let cum = 0;
      for (let i = 0; i < n; i++) { cum += burst[i]; turn.push(cum); }
      const avgTurn = turn.reduce((a,b)=>a+b, 0) / n;
      const procs = burst.map((b,i) => `P${i+1}=${b}`).join(', ');
      return buildQ(
        'medium',
        `لجدولة FCFS بـ ${n} عمليات (${procs})، ما متوسط زمن الإنجاز (Turnaround Time)؟`,
        avgTurn.toFixed(2).replace(/\.00$/,''),
        [(avgTurn + 3).toFixed(1), turn[turn.length-1].toString(), (avgTurn/2).toFixed(1), burst.reduce((a,b)=>a+b,0).toString()],
        `Turnaround لكل عملية: ${turn.join(', ')}. المتوسط = (${turn.join(' + ')}) / ${n} = ${avgTurn}`
      );

    () => {

      const addr = PICK([20, 22, 24, 26, 28, 30, 32, 36, 40, 48]);

    () => {

      return buildQ(

    () => {

      return buildQ(
        'easy',
        `إذا حدث ${faults} Page Faults من أصل ${total} وصول للذاكرة، فما معدل Page Fault؟`,
        rate + '%',
        [(faults/total*50).toFixed(1) + '%', faults + '%', total + '%', (100 - faults).toFixed(1) + '%'],
        `معدل Page Fault = (Faults ÷ Total accesses) × 100 = (${faults} ÷ ${total}) × 100 = ${rate}%`
      );

    () => {
      const conditions = ['Mutual exclusion', 'Hold and wait', 'No preemption', 'Circular wait'];

      return buildQ(

    () => {
      const burst = shuffle([RND(1,4), RND(5,8), RND(9,15), RND(16,22)]).slice(0, 3);
      const procs = burst.map((b,i) => `P${i+1}(${b})`).join(', ');
      const sortedIdx = burst.map((b,i)=>[b,i]).sort((a,b)=>a[0]-b[0]).map(p=>`P${p[1]+1}`);
      const correctOrder = sortedIdx.join(' ← ');
      return buildQ(
        'medium',
        `بجدولة SJF (الأقصر أولاً) للعمليات: ${procs}، ما ترتيب التنفيذ الصحيح؟`,

    () => {
      const burst = RND(8, 30);

        'medium',
        `لعملية burst time = ${burst}ms في جدولة Round Robin بشريحة زمنية ${tq}ms، كم مرة ستحصل على المعالج؟`,
        slices.toString(),
        [burst.toString(), tq.toString(), (slices+1).toString(), Math.floor(burst/tq).toString()],
        `عدد الشرائح = ⌈burst / quantum⌉ = ⌈${burst}/${tq}⌉ = ${slices}`

    () => {
      const bits = PICK([8, 12, 16, 20, 24, 28, 32, 36, 40, 48]);

      const value = Math.pow(2, bits - divisor);
      return buildQ(
        'medium',
        `إذا كان حجم العنوان ${bits} بت، فما حجم فضاء العنونة (Address Space) القصوى؟`,
        `${value} ${sizeUnits}`,
        [`${bits} ${sizeUnits}`, `${value*2} ${sizeUnits}`, `${Math.pow(2, divisor)} ${sizeUnits}`, `${bits*2} ${sizeUnits}`],

      );

    () => {
      const sequence = Array.from({length: RND(7, 12)}, () => RND(1, 5));

        if (cache.length > frames) cache.shift();

      return buildQ(
        'hard',
        `لتسلسل الصفحات [${sequence.join(', ')}] مع ${frames} إطارات، كم Page Fault باستخدام خوارزمية LRU؟`,

// إحصائيات السعة (مقاسة فعلياً من اختبارات المولّدات)
// ===========================================================
function getCapacity(subject) {
  const manual = (QUESTION_BANKS[subject] || []).length;
  const generators = (QUESTION_GENERATORS[subject] || []).length;
  // تقدير محافظ بناءً على القياس الفعلي (~120 تركيبة فريدة لكل قالب)
  const dynamicEstimate = generators * 120;
  return { manual, dynamic: dynamicEstimate, total: manual + dynamicEstimate };
}
// المنطق: لكل سؤال نتتبع counter آخر استخدام. عند التوليد،
//          نختار من الأسئلة الأقدم استخداماً أولاً، فلا يتكرر
//          سؤال إلا بعد دوران كل أسئلة صعوبته في البنك.
// ===========================================================
let currentSubject = 'osc';
let currentQuestions = [];
let answeredCount = 0;
let correctCount = 0;

const HISTORY_KEY = 'seu_quiz_history_v2';

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return {};
    return JSON.parse(raw) || {};
  } catch(e) { return {}; }
}
function saveHistory(h) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch(e) {}
}

function getSubjectState(subject) {
  const h = loadHistory();
  if (!h[subject]) h[subject] = { counter: 0, lastUsed: {} };
  return h[subject];
}

function pickSubject(s) {
  if (currentSubject === s) return;
  currentSubject = s;
  document.querySelectorAll('.subject-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.subject === s);
  });
  updateCapacityLine();
  // تغيير المادة → اختبار جديد فوراً
  generateQuiz();
}

function updateCapacityLine() {
  const cap = getCapacity(currentSubject);
  const el = document.getElementById('capacity-text');
  if (el) {
    el.innerHTML = `🎲 <strong>${cap.manual}</strong> سؤال نوعي مكتوب + <strong>${cap.dynamic.toLocaleString('ar')}+</strong> تركيبة ديناميكية متاحة لهذه المادة`;
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// نختار الأقدم استخداماً، مع خلط الأسئلة المتساوية في "آخر استخدام"
function pickOldest(pool, lastUsed, n) {
  // نُجمّع حسب lastUsed value
  const groups = new Map();
  pool.forEach(q => {
    const t = lastUsed[q.q] || 0;
    if (!groups.has(t)) groups.set(t, []);
    groups.get(t).push(q);
  });
  // نُرتب المفاتيح من الأقدم (أصغر counter) للأحدث، ونخلط داخل كل مجموعة
  const sortedKeys = [...groups.keys()].sort((a, b) => a - b);
  const ordered = [];
  for (const k of sortedKeys) ordered.push(...shuffle(groups.get(k)));
  return ordered.slice(0, n);
}

function pickRandomQuestions(bank, total = 10) {
  const state = getSubjectState(currentSubject);
  const generators = QUESTION_GENERATORS[currentSubject] || [];

  // عشوائية في توزيع الصعوبة
  const eCount = 2 + Math.floor(Math.random() * 3); // 2-4
  const hCount = 2 + Math.floor(Math.random() * 3); // 2-4
  const mCount = total - eCount - hCount;

  // النسبة العامة: ~40% بنك يدوي + ~60% مولّدات
  const manualCount = Math.floor(total * 0.4); // 4 من 10
  const generatedCount = total - manualCount; // 6 من 10

  // === منطق خاص بالبايثون: 30% كود + 70% نظري ===
  if (currentSubject === 'python') {
    return pickPythonQuestions(bank, generators, total, state);
  }

  // === منطق خاص بالإحصاء: 50% حسابي + 50% نظري ===
  if (currentSubject === 'stats') {
    return pickStatsQuestions(bank, generators, total, state);
  }

  // اختر من البنك اليدوي حسب صعوبة موزّعة (Round-Robin)
  const easy = bank.filter(q => q.d === 'easy');
  const medium = bank.filter(q => q.d === 'medium');
  const hard = bank.filter(q => q.d === 'hard');

  const mE = Math.max(1, Math.floor(manualCount * eCount / total));
  const mH = Math.max(1, Math.floor(manualCount * hCount / total));
  const mM = manualCount - mE - mH;

  const manualPicks = [
    ...pickOldest(easy, state.lastUsed, mE),
    ...pickOldest(medium, state.lastUsed, mM),
    ...pickOldest(hard, state.lastUsed, mH)
  ].slice(0, manualCount);

  const generatedPicks = [];
  if (generators.length > 0) {
    const shuffled = shuffle(generators);
    for (let i = 0; i < generatedCount; i++) {
      const gen = shuffled[i % shuffled.length];
      try {
        const q = gen();
        if (q && q.opts && q.opts.length === 4 && q.a >= 0) {
          generatedPicks.push(q);
        }
      } catch(e) {}
    }
  }

  const picked = [...manualPicks, ...generatedPicks];
  if (picked.length < total) {
    const usedQs = new Set(picked.map(q => q.q));
    const remaining = bank.filter(q => !usedQs.has(q.q));
    picked.push(...shuffle(remaining).slice(0, total - picked.length));
  }

  state.counter++;
  manualPicks.forEach(q => { state.lastUsed[q.q] = state.counter; });

  const h = loadHistory();
  h[currentSubject] = state;
  saveHistory(h);

  return shuffle(picked).slice(0, total);
}

// منطق خاص بالبايثون: 30% كود + 70% نظري
// من 10 أسئلة: 3 كود + 7 نظري
function pickPythonQuestions(bank, generators, total, state) {
  const codeCount = 3;
  const theoryCount = total - codeCount; // 7

  // فصل البنك اليدوي حسب category
  const manualCode = bank.filter(q => q.category === 'code');
  const manualTheory = bank.filter(q => q.category === 'theory');

  // فصل المولّدات: نولّد عيّنة من كل قالب لمعرفة category
  // لكن استدعاء كل قالب مرة لتصنيفه ثم استدعاؤه مرة أخرى مكلف
  // الحل: نُولّد عينة، ونصنف، ثم نختار
  const codeGens = [];
  const theoryGens = [];
  for (const gen of generators) {
    try {
      const sample = gen();
      if (sample.category === 'theory') theoryGens.push(gen);
      else codeGens.push(gen);
    } catch(e) {}
  }

  // نسبة البنك اليدوي:المولّدات داخل كل category: 50/50 (لإعطاء أهمية متساوية للجودة والتنوع)
  const manualCodeCount = Math.min(Math.ceil(codeCount * 0.5), manualCode.length);
  const genCodeCount = codeCount - manualCodeCount;
  const manualTheoryCount = Math.min(Math.ceil(theoryCount * 0.5), manualTheory.length);
  const genTheoryCount = theoryCount - manualTheoryCount;

  // اختيار من البنك اليدوي
  const manualPicks = [
    ...pickOldest(manualCode, state.lastUsed, manualCodeCount),
    ...pickOldest(manualTheory, state.lastUsed, manualTheoryCount)
  ];

  // توليد ديناميكي
  const generatedPicks = [];
  if (codeGens.length > 0) {
    const shuf = shuffle(codeGens);
    for (let i = 0; i < genCodeCount; i++) {
      try {
        const q = shuf[i % shuf.length]();
        if (q && q.opts && q.opts.length === 4 && q.a >= 0) generatedPicks.push(q);
      } catch(e) {}
    }
  }
  if (theoryGens.length > 0) {
    const shuf = shuffle(theoryGens);
    for (let i = 0; i < genTheoryCount; i++) {
      try {
        const q = shuf[i % shuf.length]();
        if (q && q.opts && q.opts.length === 4 && q.a >= 0) generatedPicks.push(q);
      } catch(e) {}
    }
  }

  // تجميع
  let picked = [...manualPicks, ...generatedPicks];

  // ملء الفجوات
  if (picked.length < total) {
    const usedQs = new Set(picked.map(q => q.q));
    const remaining = bank.filter(q => !usedQs.has(q.q));
    picked.push(...shuffle(remaining).slice(0, total - picked.length));
  }

  // تحديث lastUsed
  state.counter++;
  manualPicks.forEach(q => { state.lastUsed[q.q] = state.counter; });
  const h = loadHistory();
  h[currentSubject] = state;
  saveHistory(h);

  return shuffle(picked).slice(0, total);
}

// منطق خاص بالإحصاء: 50% حسابي + 50% نظري
// من 10 أسئلة: 5 حسابية + 5 نظرية
function pickStatsQuestions(bank, generators, total, state) {
  const compCount = 5;
  const theoryCount = total - compCount; // 5

  // فصل البنك اليدوي حسب category
  const manualComp = bank.filter(q => q.category === 'computational');
  const manualTheory = bank.filter(q => q.category === 'theory');

  // فصل المولّدات: نولّد عينة من كل قالب لمعرفة category
  const compGens = [];
  const theoryGens = [];
  for (const gen of generators) {
    try {
      const sample = gen();
      if (sample.category === 'theory') theoryGens.push(gen);

  }

  // نسبة البنك اليدوي:المولّدات داخل كل category: 50/50
  const manualCompCount = Math.min(Math.ceil(compCount * 0.5), manualComp.length);
  const genCompCount = compCount - manualCompCount;
  const manualTheoryCount = Math.min(Math.ceil(theoryCount * 0.5), manualTheory.length);
  const genTheoryCount = theoryCount - manualTheoryCount;

  // اختيار من البنك اليدوي
  const manualPicks = [
    ...pickOldest(manualComp, state.lastUsed, manualCompCount),
    ...pickOldest(manualTheory, state.lastUsed, manualTheoryCount)
  ];

  // توليد ديناميكي
  const generatedPicks = [];
  if (compGens.length > 0) {
    const shuf = shuffle(compGens);
    for (let i = 0; i < genCompCount; i++) {
      try {
        const q = shuf[i % shuf.length]();
        if (q && q.opts && q.opts.length === 4 && q.a >= 0) generatedPicks.push(q);
      } catch(e) {}
    }
  }
  if (theoryGens.length > 0) {
    const shuf = shuffle(theoryGens);
    for (let i = 0; i < genTheoryCount; i++) {
      try {
        const q = shuf[i % shuf.length]();
        if (q && q.opts && q.opts.length === 4 && q.a >= 0) generatedPicks.push(q);
      } catch(e) {}
    }
  }

  let picked = [...manualPicks, ...generatedPicks];

  // ملء الفجوات
  if (picked.length < total) {
    const usedQs = new Set(picked.map(q => q.q));
    const remaining = bank.filter(q => !usedQs.has(q.q));
    picked.push(...shuffle(remaining).slice(0, total - picked.length));
  }

  // تحديث lastUsed
  state.counter++;
  manualPicks.forEach(q => { state.lastUsed[q.q] = state.counter; });
  const h = loadHistory();
  h[currentSubject] = state;
  saveHistory(h);

  return shuffle(picked).slice(0, total);
}

function generateQuiz() {
  const bank = QUESTION_BANKS[currentSubject];
  if (!bank) return;

  currentQuestions = pickRandomQuestions(bank, 10);
  answeredCount = 0;
  correctCount = 0;

  renderQuiz();
  document.getElementById('clearBtn').style.display = 'flex';
  document.getElementById('result-area').innerHTML = '';
  setTimeout(() => {
    const p = document.getElementById('progress');
    if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 80);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatQuestion(text) {
  // تحويل الأكواد بين ``` ``` لـ <pre><code>، والكود الـ inline بين ` `
  let s = escapeHtml(text);
  s = s.replace(/```([\s\S]*?)```/g, (_, code) =>
    `<pre style="background:#1e293b;color:#e2e8f0;padding:10px 12px;border-radius:8px;overflow-x:auto;direction:ltr;text-align:left;font-family:'JetBrains Mono',monospace;font-size:0.82rem;margin-top:8px;line-height:1.6;">${code.trim()}</pre>`
  );
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}

function difficultyLabel(d) {
  return { easy: 'سهل', medium: 'متوسط', hard: 'صعب' }[d] || d;
}

function renderQuiz() {
  const area = document.getElementById('quiz-area');
  const progressBox = document.getElementById('progress');
  progressBox.style.display = 'block';
  updateProgress();

  area.innerHTML = currentQuestions.map((q, idx) => {
    const optsHtml = shuffleOptionsForRender(q, idx);
    return `
    <div class="quiz-q difficulty-${q.d}" id="quiz-q-${idx}">
      <div class="q-meta">
        <span class="q-num">السؤال ${idx + 1} من ${currentQuestions.length}</span>
        <span class="q-difficulty ${q.d}">${difficultyLabel(q.d)}</span>
      </div>
      <div class="q-text">${formatQuestion(q.q)}</div>
      <div class="quiz-options" id="opts-${idx}">${optsHtml}</div>
      <div class="quiz-explain"><strong>الشرح: </strong>${escapeHtml(q.e)}</div>
    </div>`;
  }).join('');
}

function shuffleOptionsForRender(q, qIdx) {
  // نخلط الخيارات لكن نتذكر أين أصبحت الإجابة الصحيحة
  const indexed = q.opts.map((opt, i) => ({ opt, isCorrect: i === q.a }));
  const shuffled = shuffle(indexed);
  // نحفظ خريطة الإجابة الصحيحة الجديدة
  q._correctIdx = shuffled.findIndex(x => x.isCorrect);
  q._renderedOpts = shuffled.map(x => x.opt);

  const letters = ['أ', 'ب', 'ج', 'د'];
  return shuffled.map((x, i) =>
    `<button class="quiz-option" onclick="answerQuestion(${qIdx}, ${i})">
      <span class="letter">${letters[i]}</span>
      <span class="opt-text">${escapeHtml(x.opt)}</span>
    </button>`
  ).join('');
}

function answerQuestion(qIdx, optIdx) {
  const q = currentQuestions[qIdx];
  const qElement = document.getElementById('quiz-q-' + qIdx);
  if (qElement.classList.contains('answered')) return;

  qElement.classList.add('answered');
  const options = qElement.querySelectorAll('.quiz-option');
  options.forEach((o, i) => {
    o.disabled = true;
    if (i === q._correctIdx) o.classList.add('correct');
    else if (i === optIdx) o.classList.add('wrong');
  });

  answeredCount++;
  if (optIdx === q._correctIdx) correctCount++;
  updateProgress();

  if (answeredCount === currentQuestions.length) showFinalResult();
}

function updateProgress() {
  const box = document.getElementById('progress');
  const pct = Math.round((correctCount / Math.max(answeredCount, 1)) * 100);
  box.innerHTML = `
    <div class="progress-bar">
      <span class="answered">📝 أُجِبت <strong>${answeredCount}</strong> من <strong>${currentQuestions.length}</strong></span>
      <span class="score">${correctCount} / ${answeredCount} ${answeredCount > 0 ? '(' + pct + '%)' : ''}</span>
    </div>`;
}

function showFinalResult() {
  const total = currentQuestions.length;
  const pct = Math.round((correctCount / total) * 100);
  let cls = 'final-result';
  let icon = '🎉';
  let msg = '';
  if (pct >= 80) { cls += ''; icon = '🏆'; msg = 'ممتاز! أنت جاهز للاختبار النهائي.'; }
  else if (pct >= 60) { cls += ' warn'; icon = '💪'; msg = 'جيد، لكن راجع الأسئلة التي أخطأت فيها.'; }
  else { cls += ' danger'; icon = '📚'; msg = 'تحتاج لمزيد من المراجعة. جرّب اختباراً جديداً بعد المراجعة.'; }

  document.getElementById('result-area').innerHTML = `
    <div class="${cls}">
      <div style="font-size:2.5rem;margin-bottom:6px;">${icon}</div>
      <div class="big-score">${correctCount} / ${total}</div>
      <div class="label">النسبة: ${pct}%</div>
      <div class="feedback">${msg}</div>
      <button class="btn-primary" onclick="generateQuiz()" style="max-width:280px;margin:0 auto;">
        <span>🎲</span><span>اختبار جديد</span>
      </button>
    </div>`;
  setTimeout(() => {
    document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 200);
}

function clearQuiz() {
  if (!confirm('هل تريد مسح الاختبار الحالي؟')) return;
  currentQuestions = [];
  answeredCount = 0;
  correctCount = 0;
  document.getElementById('progress').style.display = 'none';
  document.getElementById('result-area').innerHTML = '';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('quiz-area').innerHTML = `
    <div class="empty-state">
      <div class="ico">📝</div>
      <h2>جاهز لتولّد اختبارك التالي؟</h2>
      <p>اضغط "توليد اختبار جديد" لاختبار من 10 أسئلة عشوائية.</p>
    </div>`;
}

// ===========================================================
// توليد تلقائي عند تحميل الصفحة (في كل مرة تُفتح)
// ===========================================================
document.addEventListener('DOMContentLoaded', () => {
  updateCapacityLine();
  generateQuiz();
});

// استقبال رسالة من المنصة الرئيسية عند فتح التبويب لتوليد اختبار جديد
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'regenerate-quiz') {
    generateQuiz();
  }
});
</script>
