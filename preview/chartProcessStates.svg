      <text x="460" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="white">Ready</text>
    
      <circle cx="720" cy="400" r="65" fill="#6B46C1" opacity="0.9" stroke="#6B46C1" stroke-width="3"/>
