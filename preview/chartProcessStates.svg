      <text x="200" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="white">New</text>
    
      <circle cx="460" cy="280" r="65" fill="#B794F4" opacity="0.9" stroke="#6B46C1" stroke-width="3"/>
