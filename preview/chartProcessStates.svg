      <line x1="668.8531188802693" y1="443.27813017823365" x2="511.14688111973066" y2="576.7218698217664" stroke="#6B46C1" stroke-width="2.5"/><polygon points="511.14688111973066,576.7218698217664 516.5658840066669,566.0151239243718 522.6028861722403,573.1497628473221" fill="#6B46C1"/>
