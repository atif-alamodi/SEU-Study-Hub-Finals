<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1200" font-family="'Noto Sans Arabic','Segoe UI','Tahoma',sans-serif" style="background:white;max-width:100%;height:auto;display:block;">
    
    <text x="1010" y="80" text-anchor="end" direction="rtl" font-size="40" font-weight="700" fill="#1F2937">جدول الصفحات</text>
    <line x1="540" y1="48" x2="540" y2="92" stroke="#6B7280" stroke-width="2"/>
    <text x="70" y="80" text-anchor="start" font-size="36" font-weight="700" fill="#1F2937">Page Table</text>
    <line x1="60" y1="115" x2="1020" y2="115" stroke="#E5E7EB" stroke-width="1.5"/>
  

    <!-- العنوان الافتراضي -->
    <text x="540" y="180" text-anchor="middle" direction="rtl" font-size="20" font-weight="700" fill="#6B46C1">العنوان الافتراضي / Virtual Address (16-bit)</text>

    <!-- VPN -->
    <rect x="200" y="220" width="220" height="70" fill="#D6BCFA" stroke="#6B46C1" stroke-width="2.5"/>
    <text x="310" y="245" text-anchor="middle" direction="rtl" font-size="16" font-weight="700" fill="#1F2937">رقم الصفحة</text>
    <text x="310" y="263" text-anchor="middle" font-size="13" fill="#6B7280">VPN (4 bits)</text>
    <text x="310" y="285" text-anchor="middle" font-size="20" font-weight="700" fill="#6B46C1" font-family="monospace">0011</text>

    <!-- Offset -->
    <rect x="420" y="220" width="320" height="70" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="580" y="245" text-anchor="middle" direction="rtl" font-size="16" font-weight="700" fill="#1F2937">الإزاحة</text>
    <text x="580" y="263" text-anchor="middle" font-size="13" fill="#6B7280">Offset (12 bits)</text>
    <text x="580" y="285" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB" font-family="monospace">000010101100</text>

    <line x1="310" y1="290" x2="310" y2="345" stroke="#6B46C1" stroke-width="2.5"/>
    <polygon points="310,350 302,338 318,338" fill="#6B46C1"/>

    <!-- جدول الصفحات -->
    <rect x="200" y="360" width="380" height="290" fill="white" stroke="#6B46C1" stroke-width="2.5"/>
    <text x="390" y="390" text-anchor="middle" direction="rtl" font-size="17" font-weight="700" fill="#6B46C1">جدول الصفحات / Page Table</text>
    <line x1="200" y1="410" x2="580" y2="410" stroke="#6B46C1" stroke-width="1.5"/>
    <line x1="390" y1="410" x2="390" y2="650" stroke="#6B46C1" stroke-width="1"/>
    <text x="295" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#6B46C1">VPN</text>
    <text x="485" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#6B46C1">Frame #</text>
    
      <text x="295" y="460" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0000</text>
      <text x="485" y="460" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0101</text>
    
      <text x="295" y="490" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0001</text>
      <text x="485" y="490" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">1011</text>
    
      <text x="295" y="520" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0010</text>
      <text x="485" y="520" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0001</text>
    <rect x="200" y="532" width="380" height="28" fill="#D6BCFA"/>
      <text x="295" y="550" text-anchor="middle" font-size="15" font-weight="700" fill="#6B46C1" font-family="monospace">0011</text>
      <text x="485" y="550" text-anchor="middle" font-size="15" font-weight="700" fill="#6B46C1" font-family="monospace">0111</text>
    
      <text x="295" y="580" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0100</text>
      <text x="485" y="580" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">1100</text>
    
      <text x="295" y="610" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0101</text>
      <text x="485" y="610" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2937" font-family="monospace">0010</text>
    

    <!-- سهم إلى Physical Address -->
    <line x1="580" y1="490" x2="700" y2="490" stroke="#7C3AED" stroke-width="2.5"/>
    <polygon points="705,490 693,484 693,496" fill="#7C3AED"/>

    <!-- العنوان الفيزيائي -->
    <rect x="700" y="430" width="280" height="120" rx="8" fill="#EFF6FF" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="840" y="458" text-anchor="middle" direction="rtl" font-size="15" font-weight="700" fill="#1F2937">العنوان الفيزيائي</text>
    <text x="840" y="478" text-anchor="middle" font-size="13" fill="#6B7280">Physical Address</text>
    <text x="840" y="510" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED" font-family="monospace">0111 | 000010101100</text>
    <text x="840" y="535" text-anchor="middle" font-size="11" fill="#6B7280">Frame # | Offset</text>

    
    <rect x="50" y="950" width="980" height="220" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="600" y="980" text-anchor="end" direction="rtl" font-size="22" font-weight="700" fill="#6B46C1">خصائص</text>
    <text x="610" y="980" text-anchor="start" font-size="22" font-weight="700" fill="#6B46C1">| Key Features</text>
    <line x1="70" y1="998" x2="1010" y2="998" stroke="#DBEAFE" stroke-width="1.5"/>
  
      <circle cx="1000" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1034.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">العنوان الافتراضي = VPN + Offset</text>
    
      <circle cx="80" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1034.25" text-anchor="start" font-size="17" fill="#1F2937">Virtual Address = VPN + Offset</text>
    <line x1="70" y1="1048.5" x2="1010" y2="1048.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1074.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">جدول الصفحات يربط VPN بـ Frame #</text>
    
      <circle cx="80" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1074.75" text-anchor="start" font-size="17" fill="#1F2937">Page table maps VPN to Frame #</text>
    <line x1="70" y1="1089" x2="1010" y2="1089" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1115.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">الـ Offset لا يتغير في الترجمة</text>
    
      <circle cx="80" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1115.25" text-anchor="start" font-size="17" fill="#1F2937">Offset stays unchanged</text>
    <line x1="70" y1="1129.5" x2="1010" y2="1129.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1155.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">يُمكّن الذاكرة الافتراضية والحماية</text>
    
      <circle cx="80" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1155.75" text-anchor="start" font-size="17" fill="#1F2937">Enables virtual memory & protection</text>
    <line x1="540" y1="1006" x2="540" y2="1160" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,3"/>
  </svg>