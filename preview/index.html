<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة المخططات</title>
<style>
  body { margin:0; padding:20px; background:#f5f5f5; font-family:'Noto Sans Arabic',system-ui; }
  h1 { text-align:center; color:#6B46C1; }
  .chart { background:white; margin:20px auto; max-width:1080px; border:1px solid #e2e8f0; border-radius:14px; padding:10px; }
  .label { padding:10px; font-weight:700; color:#6B46C1; border-bottom:1px solid #e2e8f0; margin-bottom:10px; }
  .chart svg { width:100%; height:auto; }
</style>
</head>
<body>
<h1>معاينة المخططات الـ 14</h1>
<div class="chart"><div class="label">1. المدرج التكراري</div><object data="chartHistogram.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">2. التوزيع الطبيعي</div><object data="chartNormalDistribution.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">3. مخطط الانتشار</div><object data="chartScatterPlot.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">4. Z-Score</div><object data="chartZScore.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">5. الانحدار الخطي</div><object data="chartLinearRegression.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">6. مخطط الصندوق</div><object data="chartBoxPlot.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">7. حالات العملية</div><object data="chartProcessStates.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">8. Round Robin</div><object data="chartGanttRoundRobin.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">9. تخطيط الذاكرة</div><object data="chartMemoryLayout.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">10. جدول الصفحات</div><object data="chartPageTable.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">11. قائمة بايثون</div><object data="chartPythonList.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">12. قاموس بايثون</div><object data="chartPythonDict.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">13. تدفق الدالة</div><object data="chartFunctionFlow.svg" type="image/svg+xml"></object></div>
<div class="chart"><div class="label">14. مخطط الشرط</div><object data="chartIfElseFlow.svg" type="image/svg+xml"></object></div>
</body></html>
