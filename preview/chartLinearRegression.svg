    <!-- صندوق المعادلة -->
    <rect x="950" y="200" width="270" height="160" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="1210" y="232" text-anchor="end" direction="rtl" font-size="17" fill="#1F2937" font-weight="600">معادلة الانحدار</text>
    <text x="960" y="258" text-anchor="start" font-size="13" fill="#6B7280">Regression Equation</text>
    <text x="1085" y="298" text-anchor="middle" font-size="26" font-weight="700" fill="#6B46C1">y = mx + b</text>
    <text x="1210" y="328" text-anchor="end" direction="rtl" font-size="13" fill="#1F2937">m = الميل (Slope)</text>
    <text x="1210" y="348" text-anchor="end" direction="rtl" font-size="13" fill="#1F2937">b = نقطة التقاطع</text>

    <!-- شرح البواقي -->
    <rect x="60" y="610" width="240" height="80" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="290" y="638" text-anchor="end" direction="rtl" font-size="15" fill="#1F2937" font-weight="600">البواقي (Residuals)</text>
    <text x="70" y="660" text-anchor="start" font-size="13" fill="#6B7280">eᵢ = yᵢ − ŷᵢ</text>
    <text x="290" y="680" text-anchor="end" direction="rtl" font-size="11" fill="#6B7280">الفرق بين الفعلي والمتوقع</text>

    <text x="55" y="450" text-anchor="middle" direction="rtl" font-size="20" fill="#1F2937" transform="rotate(-90 55 450)">المتغير التابع y</text>
    <text x="530" y="790" text-anchor="middle" direction="rtl" font-size="20" fill="#1F2937">المتغير المستقل x</text>

    
    <rect x="50" y="950" width="980" height="220" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="600" y="980" text-anchor="end" direction="rtl" font-size="22" font-weight="700" fill="#6B46C1">خصائص</text>
    <text x="610" y="980" text-anchor="start" font-size="22" font-weight="700" fill="#6B46C1">| Key Features</text>
    <line x1="70" y1="998" x2="1010" y2="998" stroke="#DBEAFE" stroke-width="1.5"/>
  
      <circle cx="1000" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1034.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">يُنمذج العلاقة الخطية بين متغيرين</text>
    
      <circle cx="80" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1034.25" text-anchor="start" font-size="17" fill="#1F2937">Models linear relationship</text>
    <line x1="70" y1="1048.5" x2="1010" y2="1048.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1074.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">يُستخدم للتنبؤ بقيم y من x</text>
    
      <circle cx="80" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1074.75" text-anchor="start" font-size="17" fill="#1F2937">Used to predict y from x</text>
    <line x1="70" y1="1089" x2="1010" y2="1089" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1115.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">الميل m يقيس قوة العلاقة</text>
    
      <circle cx="80" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1115.25" text-anchor="start" font-size="17" fill="#1F2937">Slope m measures relationship</text>
    <line x1="70" y1="1129.5" x2="1010" y2="1129.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1155.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">R² يقيس جودة الملاءمة (0–1)</text>
    
      <circle cx="80" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1155.75" text-anchor="start" font-size="17" fill="#1F2937">R² measures fit quality (0–1)</text>
