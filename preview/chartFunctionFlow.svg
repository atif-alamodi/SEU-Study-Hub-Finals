<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1200" font-family="'Noto Sans Arabic','Segoe UI','Tahoma',sans-serif" style="background:white;max-width:100%;height:auto;display:block;">
    
    <text x="1010" y="80" text-anchor="end" direction="rtl" font-size="40" font-weight="700" fill="#1F2937">تدفق الدالة</text>
    <line x1="540" y1="48" x2="540" y2="92" stroke="#6B7280" stroke-width="2"/>
    <text x="70" y="80" text-anchor="start" font-size="36" font-weight="700" fill="#1F2937">Function Flow</text>
    <line x1="60" y1="115" x2="1020" y2="115" stroke="#E5E7EB" stroke-width="1.5"/>
  

    <!-- Input -->
    <rect x="80" y="280" width="200" height="120" rx="60" fill="#93C5FD" opacity="0.9" stroke="#2563EB" stroke-width="3"/>
    <text x="180" y="328" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="#1F2937">المدخلات</text>
    <text x="180" y="352" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2937">Input</text>
    <text x="180" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB" font-family="monospace">x, y</text>

    <line x1="280" y1="340" x2="395" y2="340" stroke="#6B46C1" stroke-width="3"/>
    <polygon points="400,340 388,333 388,347" fill="#6B46C1"/>

    <!-- Function -->
    <rect x="400" y="240" width="280" height="200" rx="14" fill="#9F7AEA" opacity="0.95" stroke="#6B46C1" stroke-width="3"/>
    <text x="540" y="290" text-anchor="middle" direction="rtl" font-size="24" font-weight="700" fill="white">الدالة</text>
    <text x="540" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="white">Function</text>
    <rect x="430" y="345" width="220" height="32" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="540" y="367" text-anchor="middle" font-size="17" font-weight="600" fill="white" font-family="monospace">def add(x, y):</text>
    <rect x="430" y="385" width="220" height="32" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="540" y="407" text-anchor="middle" font-size="17" font-weight="600" fill="white" font-family="monospace">return x + y</text>

    <line x1="680" y1="340" x2="795" y2="340" stroke="#6B46C1" stroke-width="3"/>
    <polygon points="800,340 788,333 788,347" fill="#6B46C1"/>

    <!-- Output -->
    <rect x="800" y="280" width="200" height="120" rx="60" fill="#B794F4" opacity="0.9" stroke="#7C3AED" stroke-width="3"/>
    <text x="900" y="328" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="#1F2937">المخرجات</text>
    <text x="900" y="352" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2937">Output</text>
    <text x="900" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED" font-family="monospace">x + y</text>

    <!-- مثال -->
    <rect x="100" y="500" width="880" height="160" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="540" y="528" text-anchor="middle" direction="rtl" font-size="18" font-weight="700" fill="#6B46C1">مثال على الاستخدام / Usage Example</text>
    <line x1="120" y1="548" x2="960" y2="548" stroke="#DBEAFE" stroke-width="1"/>

    <rect x="120" y="565" width="400" height="85" rx="8" fill="#1F2937"/>
    <text x="135" y="592" font-size="15" fill="#A78BFA" font-family="monospace">def add(x, y):</text>
    <text x="155" y="612" font-size="15" fill="#E5E7EB" font-family="monospace">return x + y</text>
    <text x="135" y="635" font-size="15" fill="#FBBF24" font-family="monospace">add(3, 5)  # → 8</text>

    <text x="950" y="592" text-anchor="end" direction="rtl" font-size="14" fill="#1F2937">1. تستقبل الدالة معاملين</text>
    <text x="950" y="612" text-anchor="end" direction="rtl" font-size="14" fill="#1F2937">2. تُجري عملية الجمع</text>
    <text x="950" y="632" text-anchor="end" direction="rtl" font-size="14" fill="#1F2937">3. تُرجع النتيجة عبر return</text>

    
    <rect x="50" y="950" width="980" height="220" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="600" y="980" text-anchor="end" direction="rtl" font-size="22" font-weight="700" fill="#6B46C1">خصائص</text>
    <text x="610" y="980" text-anchor="start" font-size="22" font-weight="700" fill="#6B46C1">| Key Features</text>
    <line x1="70" y1="998" x2="1010" y2="998" stroke="#DBEAFE" stroke-width="1.5"/>
  
      <circle cx="1000" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1034.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">الدالة كتلة كود قابلة لإعادة الاستخدام</text>
    
      <circle cx="80" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1034.25" text-anchor="start" font-size="17" fill="#1F2937">Reusable block of code</text>
    <line x1="70" y1="1048.5" x2="1010" y2="1048.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1074.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">تستقبل معاملات وتُرجع قيمة</text>
    
      <circle cx="80" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1074.75" text-anchor="start" font-size="17" fill="#1F2937">Takes parameters, returns value</text>
    <line x1="70" y1="1089" x2="1010" y2="1089" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1115.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">تُعرَّف بـ def وتُنفَّذ بـ call</text>
    
      <circle cx="80" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1115.25" text-anchor="start" font-size="17" fill="#1F2937">Defined with def, executed via call</text>
    <line x1="70" y1="1129.5" x2="1010" y2="1129.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1155.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">تجعل الكود أنظف وأسهل للصيانة</text>
    
      <circle cx="80" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1155.75" text-anchor="start" font-size="17" fill="#1F2937">Makes code cleaner and maintainable</text>
    <line x1="540" y1="1006" x2="540" y2="1160" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,3"/>
  </svg>