    <rect x="130" y="536" width="138" height="144" fill="#93C5FD" stroke="#6B46C1" stroke-width="1.5" opacity="0.85"/><rect x="270" y="344" width="138" height="336" fill="#D6BCFA" stroke="#6B46C1" stroke-width="1.5" opacity="0.85"/><rect x="410" y="440" width="138" height="240" fill="#9F7AEA" stroke="#6B46C1" stroke-width="1.5" opacity="0.85"/><rect x="550" y="296" width="138" height="384" fill="#6B46C1" stroke="#6B46C1" stroke-width="1.5" opacity="0.85"/><rect x="690" y="488" width="138" height="192" fill="#D6BCFA" stroke="#6B46C1" stroke-width="1.5" opacity="0.85"/>
    
