    <polygon points="560,615 570,610 570,620" fill="#2563EB"/>
    <polygon points="680,615 670,610 670,620" fill="#2563EB"/>
  
    
    <rect x="50" y="950" width="980" height="220" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
