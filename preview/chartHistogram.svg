    <polygon points="855,680 843,674 843,686" fill="#1F2937"/>
  
    <text x="200" y="710" text-anchor="middle" font-size="18" fill="#1F2937">0 – 10</text><text x="340" y="710" text-anchor="middle" font-size="18" fill="#1F2937">10 – 20</text><text x="480" y="710" text-anchor="middle" font-size="18" fill="#1F2937">20 – 30</text><text x="620" y="710" text-anchor="middle" font-size="18" fill="#1F2937">30 – 40</text><text x="760" y="710" text-anchor="middle" font-size="18" fill="#1F2937">40 – 50</text>
    <text x="55" y="440" text-anchor="middle" direction="rtl" font-size="20" fill="#1F2937" transform="rotate(-90 55 440)">التكرارات / Frequencies</text>
    <text x="480" y="755" text-anchor="middle" direction="rtl" font-size="20" fill="#1F2937">الفئات (المجالات) / Class Intervals</text>
    
    <rect x="855" y="220" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1055" y="248" text-anchor="end" direction="rtl" font-size="15" fill="#1F2937" font-weight="600">ارتفاع العمود = تكرار الفئة</text>
    <text x="865" y="278" text-anchor="start" font-size="13" fill="#6B7280">Bar Height = Frequency</text>
    <path d="M 855 260 Q 800 290 650 326" stroke="#7C3AED" stroke-width="2" fill="none"/>
    <polygon points="650,326 662,318 658,334" fill="#7C3AED"/>
    <line x1="620" y1="301" x2="620" y2="675" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="3,3"/>
  
    
    <rect x="855" y="470" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1055" y="498" text-anchor="end" direction="rtl" font-size="15" fill="#1F2937" font-weight="600">عرض العمود = طول الفئة</text>
    <text x="865" y="528" text-anchor="start" font-size="13" fill="#6B7280">Bar Width = Class Width</text>
    <path d="M 855 510 Q 760 555 580 605" stroke="#2563EB" stroke-width="2" fill="none"/>
