<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1200" font-family="'Noto Sans Arabic','Segoe UI','Tahoma',sans-serif" style="background:white;max-width:100%;height:auto;display:block;">
    
    <text x="1010" y="80" text-anchor="end" direction="rtl" font-size="40" font-weight="700" fill="#1F2937">قاموس بايثون</text>
    <line x1="540" y1="48" x2="540" y2="92" stroke="#6B7280" stroke-width="2"/>
    <text x="70" y="80" text-anchor="start" font-size="36" font-weight="700" fill="#1F2937">Python Dictionary</text>
    <line x1="60" y1="115" x2="1020" y2="115" stroke="#E5E7EB" stroke-width="1.5"/>
  
    
    <rect x="100" y="180" width="880" height="60" rx="10" fill="#1F2937" stroke="#6B46C1" stroke-width="2"/>
    <text x="120" y="218" font-size="18" fill="#E5E7EB" font-family="monospace">person = {"name": "Atif", "age": 35, "job": "HR Manager", ...}</text>
  
    <text x="310" y="278" text-anchor="middle" font-size="20" font-weight="700" fill="#6B46C1">Key (المفتاح)</text>
    <text x="705" y="278" text-anchor="middle" font-size="20" font-weight="700" fill="#6B46C1">Value (القيمة)</text>
    
      <rect x="200" y="290" width="220" height="58" rx="6" fill="#6B46C1" opacity="0.9" stroke="#6B46C1" stroke-width="2"/>
      <text x="310" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="white" font-family="monospace">"name"</text>

      <line x1="425" y1="319" x2="555" y2="319" stroke="#6B46C1" stroke-width="2.5"/>
      <polygon points="560,319 548,313 548,325" fill="#6B46C1"/>

      <rect x="565" y="290" width="280" height="58" rx="6" fill="white" stroke="#6B46C1" stroke-width="2.5"/>
      <text x="705" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#6B46C1" font-family="monospace">"Atif"</text>
    
      <rect x="200" y="360" width="220" height="58" rx="6" fill="#9F7AEA" opacity="0.9" stroke="#6B46C1" stroke-width="2"/>
      <text x="310" y="396" text-anchor="middle" font-size="18" font-weight="700" fill="white" font-family="monospace">"age"</text>

      <line x1="425" y1="389" x2="555" y2="389" stroke="#6B46C1" stroke-width="2.5"/>
      <polygon points="560,389 548,383 548,395" fill="#6B46C1"/>

      <rect x="565" y="360" width="280" height="58" rx="6" fill="white" stroke="#9F7AEA" stroke-width="2.5"/>
      <text x="705" y="396" text-anchor="middle" font-size="18" font-weight="700" fill="#9F7AEA" font-family="monospace">35</text>
    
      <rect x="200" y="430" width="220" height="58" rx="6" fill="#B794F4" opacity="0.9" stroke="#6B46C1" stroke-width="2"/>
      <text x="310" y="466" text-anchor="middle" font-size="18" font-weight="700" fill="white" font-family="monospace">"job"</text>

      <line x1="425" y1="459" x2="555" y2="459" stroke="#6B46C1" stroke-width="2.5"/>
      <polygon points="560,459 548,453 548,465" fill="#6B46C1"/>

      <rect x="565" y="430" width="280" height="58" rx="6" fill="white" stroke="#B794F4" stroke-width="2.5"/>
      <text x="705" y="466" text-anchor="middle" font-size="18" font-weight="700" fill="#B794F4" font-family="monospace">"HR Manager"</text>
    
      <rect x="200" y="500" width="220" height="58" rx="6" fill="#93C5FD" opacity="0.9" stroke="#6B46C1" stroke-width="2"/>
      <text x="310" y="536" text-anchor="middle" font-size="18" font-weight="700" fill="white" font-family="monospace">"city"</text>

      <line x1="425" y1="529" x2="555" y2="529" stroke="#6B46C1" stroke-width="2.5"/>
      <polygon points="560,529 548,523 548,535" fill="#6B46C1"/>

      <rect x="565" y="500" width="280" height="58" rx="6" fill="white" stroke="#93C5FD" stroke-width="2.5"/>
      <text x="705" y="536" text-anchor="middle" font-size="18" font-weight="700" fill="#93C5FD" font-family="monospace">"Jeddah"</text>
    
      <rect x="200" y="570" width="220" height="58" rx="6" fill="#7C3AED" opacity="0.9" stroke="#6B46C1" stroke-width="2"/>
      <text x="310" y="606" text-anchor="middle" font-size="18" font-weight="700" fill="white" font-family="monospace">"active"</text>

      <line x1="425" y1="599" x2="555" y2="599" stroke="#6B46C1" stroke-width="2.5"/>
      <polygon points="560,599 548,593 548,605" fill="#6B46C1"/>

      <rect x="565" y="570" width="280" height="58" rx="6" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
      <text x="705" y="606" text-anchor="middle" font-size="18" font-weight="700" fill="#7C3AED" font-family="monospace">True</text>
    
    
    <rect x="50" y="950" width="980" height="220" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="600" y="980" text-anchor="end" direction="rtl" font-size="22" font-weight="700" fill="#6B46C1">خصائص</text>
    <text x="610" y="980" text-anchor="start" font-size="22" font-weight="700" fill="#6B46C1">| Key Features</text>
    <line x1="70" y1="998" x2="1010" y2="998" stroke="#DBEAFE" stroke-width="1.5"/>
  
      <circle cx="1000" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1034.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">مجموعة من أزواج (مفتاح: قيمة)</text>
    
      <circle cx="80" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1034.25" text-anchor="start" font-size="17" fill="#1F2937">Collection of (key: value) pairs</text>
    <line x1="70" y1="1048.5" x2="1010" y2="1048.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1074.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">الوصول عبر المفتاح: dict[key]</text>
    
      <circle cx="80" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1074.75" text-anchor="start" font-size="17" fill="#1F2937">Access by key: dict[key]</text>
    <line x1="70" y1="1089" x2="1010" y2="1089" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1115.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">المفاتيح فريدة وغير قابلة للتغيير</text>
    
      <circle cx="80" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1115.25" text-anchor="start" font-size="17" fill="#1F2937">Keys are unique and immutable</text>
    <line x1="70" y1="1129.5" x2="1010" y2="1129.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1155.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">سرعة O(1) في البحث والإدراج</text>
    
      <circle cx="80" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1155.75" text-anchor="start" font-size="17" fill="#1F2937">O(1) lookup and insertion</text>
    <line x1="540" y1="1006" x2="540" y2="1160" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,3"/>
  </svg>