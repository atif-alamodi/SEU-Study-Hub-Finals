    <line x1="70" y1="1129.5" x2="1010" y2="1129.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1149.75" r="5" fill="#6B46C1"/>
