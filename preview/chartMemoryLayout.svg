<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1200" font-family="'Noto Sans Arabic','Segoe UI','Tahoma',sans-serif" style="background:white;max-width:100%;height:auto;display:block;">
    
    <text x="1010" y="80" text-anchor="end" direction="rtl" font-size="40" font-weight="700" fill="#1F2937">تخطيط الذاكرة</text>
    <line x1="540" y1="48" x2="540" y2="92" stroke="#6B7280" stroke-width="2"/>
    <text x="70" y="80" text-anchor="start" font-size="36" font-weight="700" fill="#1F2937">Memory Layout</text>
    <line x1="60" y1="115" x2="1020" y2="115" stroke="#E5E7EB" stroke-width="1.5"/>
  
    
      <rect x="350" y="170" width="320" height="130" fill="#6B46C1" opacity="0.9" stroke="#6B46C1" stroke-width="2" stroke-dasharray="0"/>
      <text x="510" y="223" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="white">المكدس</text>
      <text x="510" y="249" text-anchor="middle" font-size="18" font-weight="600" fill="white">Stack</text>
      <text x="510" y="286" text-anchor="middle" direction="rtl" font-size="13" fill="white" opacity="0.95">متغيرات محلية / Local vars</text>
    
        <line x1="300" y1="190" x2="300" y2="280" stroke="#7C3AED" stroke-width="3"/>
        <polygon points="300,285 292,272 308,272" fill="#7C3AED"/>
        <text x="275" y="220" text-anchor="end" direction="rtl" font-size="14" fill="#7C3AED" font-weight="600">ينمو للأسفل</text>
        <text x="275" y="240" text-anchor="end" font-size="12" fill="#7C3AED">grows down</text>
      
      <rect x="350" y="300" width="320" height="110" fill="#F3F4F6" opacity="1" stroke="#6B46C1" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="510" y="343" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="#6B7280">فجوة</text>
      <text x="510" y="369" text-anchor="middle" font-size="18" font-weight="600" fill="#6B7280">Free Space</text>
      
    
      <rect x="350" y="410" width="320" height="130" fill="#9F7AEA" opacity="0.9" stroke="#6B46C1" stroke-width="2" stroke-dasharray="0"/>
      <text x="510" y="463" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="white">الكومة</text>
      <text x="510" y="489" text-anchor="middle" font-size="18" font-weight="600" fill="white">Heap</text>
      <text x="510" y="526" text-anchor="middle" direction="rtl" font-size="13" fill="white" opacity="0.95">تخصيص ديناميكي / malloc/new</text>
    
        <line x1="300" y1="520" x2="300" y2="430" stroke="#2563EB" stroke-width="3"/>
        <polygon points="300,425 292,438 308,438" fill="#2563EB"/>
        <text x="275" y="460" text-anchor="end" direction="rtl" font-size="14" fill="#2563EB" font-weight="600">ينمو للأعلى</text>
        <text x="275" y="480" text-anchor="end" font-size="12" fill="#2563EB">grows up</text>
      
      <rect x="350" y="540" width="320" height="110" fill="#B794F4" opacity="0.9" stroke="#6B46C1" stroke-width="2" stroke-dasharray="0"/>
      <text x="510" y="583" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="white">البيانات</text>
      <text x="510" y="609" text-anchor="middle" font-size="18" font-weight="600" fill="white">BSS / Data</text>
      <text x="510" y="636" text-anchor="middle" direction="rtl" font-size="13" fill="white" opacity="0.95">متغيرات عامة / Global vars</text>
    
      <rect x="350" y="650" width="320" height="110" fill="#93C5FD" opacity="0.9" stroke="#6B46C1" stroke-width="2" stroke-dasharray="0"/>
      <text x="510" y="693" text-anchor="middle" direction="rtl" font-size="22" font-weight="700" fill="white">الكود</text>
      <text x="510" y="719" text-anchor="middle" font-size="18" font-weight="600" fill="white">Text</text>
      <text x="510" y="746" text-anchor="middle" direction="rtl" font-size="13" fill="white" opacity="0.95">تعليمات البرنامج / Code (RO)</text>
    
    <text x="342" y="180" text-anchor="end" font-size="14" fill="#1F2937" font-weight="600">High Address</text>
    <text x="342" y="755" text-anchor="end" font-size="14" fill="#1F2937" font-weight="600">0x00000000</text>
    
    <rect x="50" y="950" width="980" height="220" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="600" y="980" text-anchor="end" direction="rtl" font-size="22" font-weight="700" fill="#6B46C1">خصائص</text>
    <text x="610" y="980" text-anchor="start" font-size="22" font-weight="700" fill="#6B46C1">| Key Features</text>
    <line x1="70" y1="998" x2="1010" y2="998" stroke="#DBEAFE" stroke-width="1.5"/>
  
      <circle cx="1000" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1034.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">Stack ينمو من العنوان الأعلى للأسفل</text>
    
      <circle cx="80" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1034.25" text-anchor="start" font-size="17" fill="#1F2937">Stack grows downward</text>
    <line x1="70" y1="1048.5" x2="1010" y2="1048.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1074.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">Heap ينمو من الأسفل للأعلى</text>
    
      <circle cx="80" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1074.75" text-anchor="start" font-size="17" fill="#1F2937">Heap grows upward</text>
    <line x1="70" y1="1089" x2="1010" y2="1089" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1115.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">Text segment للقراءة فقط (read-only)</text>
    
      <circle cx="80" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1115.25" text-anchor="start" font-size="17" fill="#1F2937">Text segment is read-only</text>
    <line x1="70" y1="1129.5" x2="1010" y2="1129.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1155.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">Stack overflow عند تصادمهما</text>
    
      <circle cx="80" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1155.75" text-anchor="start" font-size="17" fill="#1F2937">Stack overflow when they meet</text>
    <line x1="540" y1="1006" x2="540" y2="1160" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,3"/>
  </svg>