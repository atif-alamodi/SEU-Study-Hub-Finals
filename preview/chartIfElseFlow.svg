<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1200" font-family="'Noto Sans Arabic','Segoe UI','Tahoma',sans-serif" style="background:white;max-width:100%;height:auto;display:block;">
    
    <text x="1010" y="80" text-anchor="end" direction="rtl" font-size="40" font-weight="700" fill="#1F2937">مخطط الشرط</text>
    <line x1="540" y1="48" x2="540" y2="92" stroke="#6B7280" stroke-width="2"/>
    <text x="70" y="80" text-anchor="start" font-size="36" font-weight="700" fill="#1F2937">If-Else Flowchart</text>
    <line x1="60" y1="115" x2="1020" y2="115" stroke="#E5E7EB" stroke-width="1.5"/>
  

    <!-- Start -->
    <ellipse cx="540" cy="200" rx="90" ry="35" fill="#6B46C1" stroke="#6B46C1" stroke-width="2"/>
    <text x="540" y="207" text-anchor="middle" direction="rtl" font-size="18" font-weight="700" fill="white">بداية / Start</text>

    <line x1="540" y1="235" x2="540" y2="280" stroke="#6B46C1" stroke-width="2.5"/>
    <polygon points="540,285 533,273 547,273" fill="#6B46C1"/>

    <!-- Decision -->
    <polygon points="540,290 700,395 540,500 380,395" fill="#D6BCFA" stroke="#6B46C1" stroke-width="3"/>
    <text x="540" y="380" text-anchor="middle" direction="rtl" font-size="17" font-weight="700" fill="#1F2937">هل الشرط صحيح؟</text>
    <text x="540" y="402" text-anchor="middle" font-size="14" fill="#6B7280">Is condition true?</text>
    <text x="540" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#6B46C1" font-family="monospace">if x &gt; 10:</text>

    <!-- True path -->
    <line x1="380" y1="395" x2="220" y2="395" stroke="#9F7AEA" stroke-width="2.5"/>
    <polygon points="215,395 227,388 227,402" fill="#9F7AEA"/>
    <text x="300" y="385" text-anchor="middle" font-size="16" font-weight="700" fill="#9F7AEA">True ✓</text>
    <text x="300" y="412" text-anchor="middle" direction="rtl" font-size="13" font-weight="600" fill="#9F7AEA">صحيح</text>

    <!-- False path -->
    <line x1="700" y1="395" x2="860" y2="395" stroke="#7C3AED" stroke-width="2.5"/>
    <polygon points="865,395 853,388 853,402" fill="#7C3AED"/>
    <text x="780" y="385" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED">False ✗</text>
    <text x="780" y="412" text-anchor="middle" direction="rtl" font-size="13" font-weight="600" fill="#7C3AED">خطأ</text>

    <!-- if block -->
    <rect x="80" y="445" width="260" height="100" rx="10" fill="#9F7AEA" opacity="0.9" stroke="#6B46C1" stroke-width="2.5"/>
    <text x="210" y="478" text-anchor="middle" direction="rtl" font-size="20" font-weight="700" fill="white">نفّذ كتلة if</text>
    <rect x="100" y="495" width="220" height="32" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="210" y="517" text-anchor="middle" font-size="15" font-weight="600" fill="white" font-family="monospace">print("Big")</text>

    <!-- else block -->
    <rect x="740" y="445" width="260" height="100" rx="10" fill="#7C3AED" opacity="0.9" stroke="#6B46C1" stroke-width="2.5"/>
    <text x="870" y="478" text-anchor="middle" direction="rtl" font-size="20" font-weight="700" fill="white">نفّذ كتلة else</text>
    <rect x="760" y="495" width="220" height="32" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="870" y="517" text-anchor="middle" font-size="15" font-weight="600" fill="white" font-family="monospace">print("Small")</text>

    <!-- Join -->
    <line x1="210" y1="545" x2="210" y2="640" stroke="#6B46C1" stroke-width="2.5"/>
    <line x1="210" y1="640" x2="540" y2="640" stroke="#6B46C1" stroke-width="2.5"/>
    <line x1="870" y1="545" x2="870" y2="640" stroke="#6B46C1" stroke-width="2.5"/>
    <line x1="870" y1="640" x2="540" y2="640" stroke="#6B46C1" stroke-width="2.5"/>
    <line x1="540" y1="640" x2="540" y2="690" stroke="#6B46C1" stroke-width="2.5"/>
    <polygon points="540,695 533,683 547,683" fill="#6B46C1"/>

    <!-- End -->
    <ellipse cx="540" cy="730" rx="90" ry="35" fill="#6B46C1" stroke="#6B46C1" stroke-width="2"/>
    <text x="540" y="737" text-anchor="middle" direction="rtl" font-size="18" font-weight="700" fill="white">نهاية / End</text>

    
    <rect x="50" y="950" width="980" height="220" rx="14" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="2"/>
    <text x="600" y="980" text-anchor="end" direction="rtl" font-size="22" font-weight="700" fill="#6B46C1">خصائص</text>
    <text x="610" y="980" text-anchor="start" font-size="22" font-weight="700" fill="#6B46C1">| Key Features</text>
    <line x1="70" y1="998" x2="1010" y2="998" stroke="#DBEAFE" stroke-width="1.5"/>
  
      <circle cx="1000" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1034.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">يفحص شرطاً ويختار مساراً واحداً</text>
    
      <circle cx="80" cy="1028.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1034.25" text-anchor="start" font-size="17" fill="#1F2937">Checks condition, picks one branch</text>
    <line x1="70" y1="1048.5" x2="1010" y2="1048.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1074.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">if: ينفّذ إذا كان الشرط صحيحاً</text>
    
      <circle cx="80" cy="1068.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1074.75" text-anchor="start" font-size="17" fill="#1F2937">if: executes when True</text>
    <line x1="70" y1="1089" x2="1010" y2="1089" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="980" y="1115.25" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">else: ينفّذ إذا كان الشرط خاطئاً</text>
    
      <circle cx="80" cy="1109.25" r="5" fill="#6B46C1"/>
      <text x="100" y="1115.25" text-anchor="start" font-size="17" fill="#1F2937">else: executes when False</text>
    <line x1="70" y1="1129.5" x2="1010" y2="1129.5" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3,3"/>
      <circle cx="1000" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="980" y="1155.75" text-anchor="end" direction="rtl" font-size="19" fill="#1F2937">يمكن استخدام elif لشروط متعددة</text>
    
      <circle cx="80" cy="1149.75" r="5" fill="#6B46C1"/>
      <text x="100" y="1155.75" text-anchor="start" font-size="17" fill="#1F2937">Use elif for multiple conditions</text>
    <line x1="540" y1="1006" x2="540" y2="1160" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3,3"/>
  </svg>